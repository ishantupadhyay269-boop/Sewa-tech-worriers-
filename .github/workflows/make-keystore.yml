name: Make Keystore (one time)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Naya password (kam se kam 8 akshar, yaad rakhein)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        env:
          PASS: ${{ github.event.inputs.password }}
        run: |
          keytool -genkeypair -v -keystore release.jks -alias seva \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Seva Tech Warriors, O=Tetratech, C=IN"
          base64 -w0 release.jks > KEYSTORE_BASE64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: KEYSTORE_BASE64.txt
          retention-days: 1
          
