name: Build Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -q Seva_Tech_Warriors_GitHub_Upload.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: |
          pip install pillow
          python3 scripts/patch_android.py
          python3 scripts/make_icons.py
      - run: npx cap sync android
      - name: Build unsigned release
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias seva \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out Seva-Tech-Warriors-release.apk aligned.apk
          $BT/apksigner verify Seva-Tech-Warriors-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Seva-Tech-Warriors-RELEASE-APK
          path: app/Seva-Tech-Warriors-release.apk
          
